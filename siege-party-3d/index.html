<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#17130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Siege Party 3D">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<title>Siege Party 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#17130f;color:#f4ead2;font:14px/1.3 system-ui,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template:"p1" minmax(0,1fr) "mid" 30px "p0" minmax(0,1fr)/minmax(0,1fr)}
body.solo #stage{grid-template:"mid" 30px "p0" minmax(0,1fr)/minmax(0,1fr)}
/* one person on this device: whichever seat is theirs fills it */
body.solo #stage .panel{grid-area:p0}
body.quad #stage{grid-template:"p2 p1" minmax(0,1fr) "mid mid" 30px "p0 p3" minmax(0,1fr)/minmax(0,1fr) minmax(0,1fr);column-gap:6px}
body.quad.three #stage{grid-template-areas:"p2 p1" "mid mid" "p0 p0"}
#p0{grid-area:p0}body #p1{grid-area:p1}body.quad #p2{grid-area:p2}body.quad #p3{grid-area:p3}
body.turned #stage{transform:translate(-50%,-50%) rotate(90deg)}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column}
.panel[hidden],.gone[hidden]{display:none}
.panel.north{transform:rotate(180deg)}
.gone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0d100bd9;font:700 22px Georgia,serif;color:#ffd98a;z-index:1}
.panel.out .hud{opacity:.35;pointer-events:none}
.card .more{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas.gl{pointer-events:none}
.title .v3{font-size:.5em;vertical-align:super;color:#ffd84a;letter-spacing:.05em}
body.gl3d canvas.fx{background:none}
canvas.fx{pointer-events:none;background:radial-gradient(ellipse 120% 90% at 15% 0%,rgba(255,244,210,.13),rgba(255,244,210,0) 55%,rgba(26,44,60,.18))}
canvas.mini{inset:auto;right:4px;top:4px;width:56px;height:84px;border:2px solid var(--team);image-rendering:pixelated;background:#161b13}
.zoom,.zoomin{position:absolute;left:5px;top:5px;width:34px;height:34px;font-size:22px;line-height:1;background:#251d15d9}
.zoomin{top:44px}
.zoom.end,.zoomin.end{opacity:.45}
button.danger{border-color:#e0705c}
button.label{background:#17130f;cursor:default;box-shadow:none}
.toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:95%;overflow:hidden;text-overflow:ellipsis;background:#17130fe6;border:1px solid #f2c230;border-radius:20px;padding:4px 14px;white-space:nowrap;pointer-events:none}
.hud{flex:none;background:linear-gradient(#2f251a,#1f1811);box-shadow:0 -3px 10px rgba(0,0,0,.35);border-top:3px solid var(--team);padding:3px 5px 5px;display:flex;flex-direction:column;gap:3px}
.res{flex:none;height:18px;align-items:center;display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
i{font-style:normal;font-size:11px;font-weight:700;color:#c9bda0}
i.food{color:#ff8da6}i.wood{color:#d9a566}i.gold{color:#ffd23f}i.stone{color:#c3cbc8}
/* always two lines tall: a changing height would stretch the map above it */
.info{flex:none;font-size:11.5px;line-height:14px;color:#d8cbaa;height:28px;overflow:hidden}
.info.tall{font-size:10.5px}
.res .age{font-family:Georgia,serif;color:#ffd98a;border:1px solid #7b6444;border-radius:4px;padding:0 4px;min-width:22px;text-align:center}
.actions,.groups{display:flex;gap:4px}
.actions{height:44px}.groups{height:36px}
button{font:inherit;color:inherit;background:linear-gradient(#55442f,#3d3022);border:1px solid #84694a;border-radius:8px;cursor:pointer;touch-action:none;box-shadow:inset 0 1px 0 rgba(255,232,180,.14),0 2px 0 rgba(0,0,0,.35)}
button:active{filter:brightness(1.35);transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,232,180,.14)}
.actions button,.groups button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
button b{font-size:12.5px}button small{display:block;font-size:10px;color:#c9bda0}
button.go{background:linear-gradient(#4f8a34,#386424);border-color:#8fd45e}
button.poor{opacity:.55}
button.alert{border-color:#f2c230;box-shadow:inset 0 0 0 1px #f2c230}
.groups button.x{flex:0 0 42px}
.groups.many{gap:3px}
.groups.many button b{font-size:11px;letter-spacing:-.3px}
.groups.many button.x{flex:0 0 28px}
.actions button.x{flex:0 0 28px}
.actions.many{gap:3px}
.actions.many button b{font-size:10.5px;letter-spacing:-.2px}
.actions.many button small{font-size:9px;letter-spacing:-.2px}
@media (min-width:600px) and (min-height:600px){body:not(.quad) .actions.many button b{font-size:12.5px;letter-spacing:0}body:not(.quad) .actions.many button small{font-size:10px;letter-spacing:0}}
#mid{grid-area:mid;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#211a12,#140f0b)}
#mid button{height:26px;padding:0 18px}
#clock{font-variant-numeric:tabular-nums;min-width:44px;text-align:center;color:#c9bda0}
#overlay{position:absolute;inset:0;background:#0d100bd9;display:flex;overflow:auto;padding:16px;z-index:2;touch-action:pan-y}
#overlay[hidden],.toast[hidden]{display:none}
#overlay button{touch-action:pan-y}
#overlay.menu{background:radial-gradient(ellipse 90% 55% at 50% 0%,#3b2b18,transparent),radial-gradient(ellipse 120% 80% at 50% 100%,#0d0a07,transparent),#18130e}
.card{margin:auto;width:min(340px,100%);display:flex;flex-direction:column;gap:9px;text-align:center}
.card h1{font:700 40px/1.1 Georgia,serif;color:#ffd98a}
.card h1.title{font-size:46px;letter-spacing:.5px;background:linear-gradient(#fff0c4,#f2c25a 55%,#c98a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2f10) drop-shadow(0 6px 10px rgba(0,0,0,.45));margin-top:-6px}
.card .emblem{width:220px;max-width:70%;align-self:center;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.card p.motto{display:flex;align-items:center;gap:10px;justify-content:center;color:#d8cbaa;font:italic 15px Georgia,serif;margin-bottom:4px}
.card p.motto::before,.card p.motto::after{content:"";height:1px;width:34px;background:linear-gradient(90deg,transparent,#c9a25a)}
.card p.motto::after{transform:scaleX(-1)}
.card h2{font:700 30px Georgia,serif;color:#ffd98a}
.card .flip{transform:rotate(180deg);margin-bottom:20px}
.card button{min-height:46px;padding:6px}
.card button b{font-size:16px}
.card ol{text-align:left;padding:6px 0 0 20px;font-size:13px;color:#d8cbaa}
.card li{margin-bottom:5px}
.chips,.styles{display:flex;flex-direction:column;gap:5px;border:1px solid #6b5638;border-radius:10px;padding:8px;background:rgba(255,236,200,.035)}
.chips h3,.styles h3,.card>h3{font-size:14px;color:#ffd98a}
.chips>div{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.styles>div{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.styles p,.card p.status{font-size:12px;color:#c9bda0}
.card .chips button,.card .styles button{min-height:40px;padding:3px}
.card .chips button b,.card .styles button b{font-size:13.5px}
.chips button.on,.styles button.on{outline:2px solid #fff27a;outline-offset:-2px;background:#5a4630}
.picks,.codes{display:flex;flex-direction:column;gap:8px}
.codes:empty,.roster:empty{display:none}
.roster{display:flex;flex-direction:column;gap:4px;text-align:left;font-size:13px}
.roster div{border-left:6px solid;background:#251d15;padding:5px 8px;border-radius:4px}
.card input[type=text],.card textarea{font:inherit;font-size:16px;color:#f4ead2;background:#251d15;border:1px solid #7b6444;border-radius:7px;padding:9px;width:100%;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;touch-action:auto;resize:none}
.card textarea{font:12px/1.35 ui-monospace,monospace;word-break:break-all}
.editor{margin:auto;width:min(380px,100%);display:flex;flex-direction:column;gap:7px;text-align:center}
.editor h2{font:700 22px Georgia,serif;color:#ffd98a}
.editor p{font-size:12.5px;color:#d8cbaa}
.editor button,.editor .file{min-height:40px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.editor .file{background:#3f6b2a;border:1px solid #8fd45e;border-radius:7px;font-weight:700;cursor:pointer}
.editor input{position:absolute;width:1px;height:1px;opacity:0}
.editor canvas{position:static;align-self:center;height:auto;border:2px solid #7b6444;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.editor canvas.board{image-rendering:auto;border-radius:10px;background:#8cb8cc}
.editor .stage{position:relative;align-self:center;display:flex}
.editor button:disabled,.editor button.end{opacity:.45}
.editor .tally{white-space:pre-line;font-size:11.5px;color:#f0e2bd;line-height:1.45}
.editor .tools i.hand::before{content:"✋";font-style:normal;font-size:12px;line-height:10px}
.editor .row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.editor .tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.editor button.on{outline:2px solid #fff27a;outline-offset:-2px}
.sizes{border:1px solid #6b5638;border-radius:10px;padding:8px;background:rgba(255,236,200,.035);display:flex;flex-direction:column;gap:6px}
.sizes h3{font-size:15px;color:#ffd98a}
.sizes .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.card .sizes button{min-height:40px;padding:3px 0}
.card .sizes button b{font-size:12.5px}
.sizes button.on{outline:2px solid #fff27a;outline-offset:-2px}
.sizes .dim{display:grid;grid-template-columns:48px 38px 1fr 38px 34px;gap:5px;align-items:center;font-size:13px}
.card .sizes .dim button{font-size:20px}
.sizes input[type=range]{width:100%;height:36px;accent-color:#ffd98a;touch-action:none}
.sizes output{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.sizes p{font-size:12px;color:#c9bda0}
.editor .tools i{width:14px;height:10px;display:block;border-radius:2px}
</style>
</head>

uniform vec3 uSun;

uniform vec2 uMap;
uniform vec3 uEye;
uniform float uTime;
uniform float uShadowOn;

float shadowAt(vec3 w) {
  if (uShadowOn < 0.5) return 1.0;
  vec4 l = uLVP * vec4(w, 1.0);
  vec3 c = l.xyz / l.w * 0.5 + 0.5;
  if (c.x <= 0.001 || c.x >= 0.999 || c.y <= 0.001 || c.y >= 0.999 || c.z >= 1.0) return 1.0;

  s += texture(uShadow, vec3(c.xy + vec2(-0.7, -0.7) * t, c.z));
  s += texture(uShadow, vec3(c.xy + vec2(0.7, -0.7) * t, c.z));
  s += texture(uShadow, vec3(c.xy + vec2(-0.7, 0.7) * t, c.z));
  s += texture(uShadow, vec3(c.xy + vec2(0.7, 0.7) * t, c.z));
  return s * 0.25;
}

vec3 faceNormal(vec3 w) {
  vec3 n = normalize(cross(dFdx(w), dFdy(w)));
  if (dot(n, uEye - w) < 0.0) n = -n;
  return n;
}

vec3 lit(vec3 base, vec3 n, vec3 w) {
  float d = dot(n, uSun);
  float sh = d > 0.0 ? shadowAt(w + n * 0.04) : 0.0;
  vec3 amb = mix(uBounce, uSky, n.y * 0.5 + 0.5);

  return base * (amb + uSunCol * wrap);

/** a warm, gently rich finish */
vec3 grade(vec3 c) {
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(l), c, 1.04);
  return c * vec3(1.02, 1.0, 0.97);

float fogAt(vec2 xz) {

  v += texture(uFog, uv + vec2(0.3, -0.75) * t).r * 0.18;
  return v;
}

vec3 fogOfWar(vec3 c, vec3 w) {

<ol>
<li><b>Move around.</b> Drag the map, or touch the minimap to jump. \u2212 / + changes zoom.</li>
<li><b>Gather.</b> Tap a Folk (or <b>All Folk</b>), then trees, berries, gold or stone. Double-tap a unit to pick all of its kind. A Storehouse shortens long walks.</li>
<li><b>Build.</b> With Folk picked, choose a building and <b>tap the map where you want it</b>. Any clear ground works.</li>
<li><b>Walls.</b> Pick Palisade or Stone wall, tap a start, then tap again: the wall runs to that spot. Keep tapping for corners. Put a <b>Gate</b> on open ground or on your wall: only your people can pass.</li>
<li><b>Ages.</b> Tap your Hall to move from the <b>Village</b> to the <b>Town</b> age (needs a Barracks or Dock), then the <b>Castle</b> age (needs a Smithy). Each unlocks new buildings, units and upgrades.</li>
<li><b>Army.</b> Barracks (Levy). Town age: Range (Archer), Stable (fast Rider). Castle age: Workshop (Ram, to break walls and buildings).</li>
<li><b>Ships.</b> Build a <b>Dock</b> on any shore. Fishing boats gather fish and bring it to your Dock. <b>Galleys</b> (Town age) fight ships and shore targets. <b>Bombard ships</b> (Castle age) smash coastal buildings from far off.</li>
<li><b>Transports.</b> Build one at a Dock. Pick your people or army, then tap the Transport to board (10 places; a Ram takes 3). Pick the Transport and tap a far shore to land them, or press <b>Land everyone</b>.</li>
<li><b>Upgrades.</b> Tap a Storehouse, Smithy, Barracks, Range, Stable or Dock.</li>
<li><b>Repair</b> by picking Folk and tapping a damaged building.</li>
<li><b>Gathering point.</b> Tap a building that makes units, then tap the map: a flag shows where new units will go. Tap a tree, berries, gold, stone or one of your fields and new Folk start work there. Tap the building again to clear it.</li>
<li><b>Demolish</b> a building or field you no longer want: tap it, then press <b>Demolish</b> twice.</li>
<li><b>Castle age.</b> Once your Hall reaches the Castle age, Folk can build a <b>Market</b>, to buy and sell food, wood and stone for gold (handy when the map runs out of something), and a <b>Castle</b>: a fortress that makes Folk and soldiers, takes in anything gathered and keeps you in the game even if your Hall falls.</li>
<li><b>Housing.</b> Folk live in homes: your Hall houses 5, each Cottage 5, and in the Town age a Cottage can be enlarged into a <b>Manor</b> for 12. Soldiers and warships live in <b>Barracks</b>, 10 to each. Build more homes and barracks for more people; there is no other limit.</li>
<li><b>Soldiers fight back</b> against whatever hurts them. Turn on <b>Sentry</b> and they also run to defend buildings and people near their post that come under attack, then return to it.</li>
<li><b>Allies.</b> With 3 or more players, press <b>Allies</b> to ask, accept or end an alliance (ending one takes 10 seconds). Allies don't fight, share what they see, can pass each other's gates and can win together. You each need someone left to fight when you join up.</li>
<li><b>Win</b> by being the last side with a Hall or Castle standing.</li>
