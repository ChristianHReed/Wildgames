function survivor(look){

/* ---------- aliens: pose by clip frame ---------- */

      at(survivor(lookOf('farmer',{frame:C.wave[1]})),2.2,0,-2.2,-0.3);
      cam.position.set(0,2.3,7.6); ctl.target.set(0,0.9,-1.0); }},
  mapfx:{t:'Paper map, effects and fire',d:'The folded and open map, then muzzle flash, tracer, sparks, dust, splashes and ripples, three flames, a smoke column, explosion core, ring and debris, flare, goo, glass shards and wood chips.',
    make(){ lights('dusk'); ground(60,40,0x6a6660);
      const fc=colourer(FX.palette,{}), E=FX.models.effects, names=Object.keys(E);
      names.forEach((n,i)=>{ const m=mesh(E[n],fc); const x=(i%7-3)*1.5, z=-Math.floor(i/7)*1.8; m.position.set(x, (n==='muzzle_flash'||n==='tracer'||n==='flare_glow')?0.6:0, z); if (n==='tracer'||n==='muzzle_flash') m.rotation.y=Math.PI/2; scene.add(m); });
      const hc=colourer(HE.palette,{}); const mo=mesh(HE.models.map.open,hc); mo.position.set(-6.2,0.7,0.6); mo.rotation.set(-0.3,0,0); scene.add(mo); const mf=mesh(HE.models.map.folded,hc); mf.position.set(-6.2,0.02,1.5); scene.add(mf);
      cam.position.set(-1,4.5,9.5); ctl.target.set(-1,0.4,-1.6); }},
  sky:{t:'Sky pieces at night',d:'The eight moon phases, fair, overcast and storm clouds, lightning, rain and snow, and the faint aurora for the last night (shown small and close).',
    make(){ lights('night'); scene.background=new THREE.Color(0x0b1018); ground(200,200,0x1e2420);
      const fc=colourer(FX.palette,{}), K=FX.models.sky;
      for (let i=0;i<8;i++){ const m=mesh(K['moon_'+i],fc); m.position.set((i-3.5)*2.4,9,-20); scene.add(m); }
      const add=(n,x,y,z,s)=>{ const m=mesh(K[n],fc); m.position.set(x,y,z); m.scale.setScalar(s); scene.add(m); return m; };
      add('cloud_fair',-12,4,-25,1.6); add('cloud_overcast',2,5,-30,1.2); add('cloud_storm',14,0,-30,1.6); add('lightning',8,0,-24,0.6); add('aurora',0,4,-40,2.2);
      for (let i=0;i<40;i++) add(i%2?'rain_streak':'snow_flake',-6+(i%10)*1.3,0.5+Math.floor(i/10)*0.9,-6,i%2?2:4);
      cam.position.set(0,3,8); ctl.target.set(0,6,-20); }},
  ground_tiles:{t:'Ground materials',d:'Two-metre tiles in summer colours (road, centre line, sidewalk, grass, dry grass, dirt, gravel, mud, sand, water edge, leaf litter in autumn, snow), the kerb, and puddle, ice, crack and pothole decals.',
    make(){ lights('day'); scene.background=new THREE.Color(0xeeeae2); scene.fog=null;
      const T=GR.models.tiles, keys=Object.keys(T);
      keys.forEach((n,i)=>{ const season=n==='leaf_litter'?'autumn':n==='snow'?'winter':'summer'; const c=colourer(GR.palette,GR.seasons[n][season],GR.darker); const m=mesh(T[n],c); m.position.set((i%6-2.5)*2.15,0,-Math.floor(i/6)*2.15); scene.add(m); });
      const road=colourer(GR.palette,GR.seasons.road.summer); ['puddle','ice','crack','pothole'].forEach((n,i)=>{ const t=mesh(T.road,road); t.position.set((i-1.5)*2.15+1,0,-4.3); scene.add(t); const d=mesh(GR.models.decals[n],road); d.position.set((i-1.5)*2.15+1,0,-4.3); scene.add(d); });
      const k=mesh(GR.models.kerb.kerb_strip,colourer(GR.palette,{})); k.position.set(-5.4,0,-4.3); scene.add(k);
      cam.position.set(0,9,9); ctl.target.set(0,0,-2); }},
  damage2:{t:'Broken building states',d:'Damaged wall, window, door, shopfront and garage bays; holes knocked through plain, siding and brick; snapped frames; rubble piles; torn wallpaper inside; bare studs; a boarded door.',
    make(){ lights('day'); scene.background=new THREE.Color(0xeeeae2); scene.fog=null; ground(80,40,0xd8d2c6);
      const cols=BU.examples.corner_store, list=[['wall_plain_damaged','concrete'],['window_siding_damaged','timber'],['door_plain_damaged','concrete'],['shopfront_damaged','steel'],['garage_damaged','concrete'],
        ['hole_plain','concrete'],['hole_siding','timber'],['hole_brick','steel'],['studs','timber'],['door_boarded','timber'],[null,'concrete','snapped'],['rubble_large','concrete'],['inside_torn','timber']];
      list.forEach(([inf,fr,sn],i)=>{ const x=(i%5-2)*3.1, z=-Math.floor(i/5)*4.6, pal=[BU.examples.timber_house,BU.examples.brick_shop,BU.examples.corner_store][i%3];
        at(module(sn?'frame_'+fr+'_snapped':'frame_'+fr,pal),x,0,z); if(!sn) at(module('corner_'+fr,pal),x+1.2,0,z); at(module('plinth',pal),x,0,z); if(inf) at(module(inf,pal),x,0,z, inf==='inside_torn'?Math.PI:0); });
      cam.position.set(1,8,17); ctl.target.set(0,1.2,-4.4); }},
  street_props:{t:'Street props, plants and vehicles',d:'Lamps, signals, bins, barriers, fences, poles, trees and four boxy worn vehicles.',
    make(){ lights('day'); scene.background=new THREE.Color(0xeeeae2); scene.fog=null; ground(80,60,0xd8d2c6);
      const st=Object.keys(PR.models.street); st.forEach((n,i)=>at(prop('street',n),(i%9-4)*2.6,0,-(Math.floor(i/9))*3.4-4,0));
      Object.keys(PR.models.plants).forEach((n,i)=>at(prop('plants',n),(i-2.5)*3.4,0,-12,0.4*i));
      Object.keys(PR.models.vehicles).forEach((n,i)=>at(prop('vehicles',n),(i-1.5)*5,0,3.5,Math.PI/2));
      cam.position.set(0,14,24); ctl.target.set(0,1.5,-4); }},
};
function street(mode){
  lights(mode); const night=mode==='night';
  ground(160,160,night?0x2e3a2c:0x6d7a4f);
  const road=new THREE.Mesh(new THREE.PlaneGeometry(160,9), new THREE.MeshLambertMaterial({color:night?0x1e1f22:0x3a3a3c})); road.rotation.x=-Math.PI/2; road.position.set(0,0.01,9); road.receiveShadow=true; scene.add(road);
  const walk=new THREE.Mesh(new THREE.BoxGeometry(160,0.15,3), new THREE.MeshLambertMaterial({color:night?0x4a4846:0x9a948a})); walk.position.set(0,0.075,3.5); walk.receiveShadow=true; scene.add(walk);
  const L=night?3:0;
  at(building('timber_house',null,L),-15,0,-3.5); at(building('brick_shop',null,L),-5.5,0,-2.5);
  at(building('concrete_flats',null,L),6.5,0,-2.5); at(building('corner_store'),18,0,-2.5);
  for (const x of [-20,-8,4,16]){ const L=at(prop('street','street_lamp'),x,0.15,4.6,Math.PI); if (night){ const l=new THREE.SpotLight(0xffc477,60,16,0.9,0.6,1.5); l.position.set(x,4.6,3.7); l.target.position.set(x,0,3.7); scene.add(l); scene.add(l.target); } }
  at(prop('street','hydrant'),-10,0.15,4.2); at(prop('street','trash_bin'),-2,0.15,4.4); at(prop('street','bus_stop'),10.5,0.15,3.4,Math.PI); at(prop('street','mailbox'),-12.5,0.15,4.4);
  at(prop('street','stop_sign'),23,0.15,4.6,Math.PI); at(prop('street','dumpster'),12.5,0,-4.6,0.1); at(prop('street','traffic_cone'),2,0,7.2); at(prop('street','traffic_cone'),2.8,0,7.6);
  at(prop('street','jersey_barrier'),20,0,8,0.25); at(prop('street','tyre_pile'),23.5,0,1.6);
  for (let i=0;i<4;i++) at(prop('street','picket_fence'),-20.5+i*2.4,0,2.0);
  at(prop('plants','oak'),-20,0,-6); at(prop('plants','pine'),-25,0,-1.5); at(prop('plants','bush'),-11.5,0,1.2); at(prop('plants','dead_tree'),26,0,-4); at(prop('plants','bush'),1.5,0,1.4);
  at(prop('vehicles','hatchback'),-6,0,8.2,Math.PI/2); at(prop('vehicles','pickup'),-17,0,7.0,-Math.PI/2+0.1); at(prop('vehicles','van'),14,0,8.6,Math.PI/2); at(prop('vehicles','sedan'),22,0,10.5,0.7);
  if (!night){ at(survivor(LOOKS[0]),-3,0.15,3.6,0.4); at(survivor(LOOKS[5]),-2.2,0.15,3.2,-0.6); at(survivor(LOOKS[6]),7.5,0.15,3.4,2.4); }
  else { at(survivor(LOOKS[7]),-3,0.15,3.4,0.6); const s=at(alien('stalker','walk',0),9,0,9.5,-1.7); glowLight(s,0x9cff6a,4,5).position.set(0,2,0.5);
    const w=at(alien('swarmer','walk',1),5,0,11,-1.5); glowLight(w,0x9cff6a,3,4).position.set(0,0.6,0.5); }
}

/* ---------- UI ---------- */
const bar=document.getElementById('bar');
for (const k in SCENES){ const b=document.createElement('button'); b.textContent=SCENES[k].t; b.dataset.k=k; b.onclick=()=>show(k); bar.appendChild(b); }
function show(k){
  if (scene) scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  scene=new THREE.Scene(); stats={tris:0,verts:0}; cam.fov=35; cam.updateProjectionMatrix(); SCENES[k].make();
  document.getElementById('cap').hidden=false; document.getElementById('capT').textContent=SCENES[k].t;
  document.getElementById('capD').textContent=SCENES[k].d+' Scene: '+stats.tris.toLocaleString('en-US')+' triangles, '+stats.verts.toLocaleString('en-US')+' vertices.';
  bar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===k)));
  location.hash=k; ctl.update(); window.__ready=k;
}
function resize(){ const w=innerWidth,h=innerHeight; R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
if (/[?&]shot/.test(location.search)) document.body.classList.add('shot');
document.getElementById('status').remove();
show((location.hash.slice(1) in SCENES)?location.hash.slice(1):'survivors');
window.__show=show; window.__stats=()=>stats;
R.setAnimationLoop(()=>{ ctl.update(); R.render(scene,cam); });
</script>
