<html lang="en">

<title>Afterstreet Asset Album</title>
<style>

  html,body{margin:0;height:100%;background:var(--bg);color:#eee;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;max-width:calc(100% - 24px)}
  #bar button,#bar select{background:var(--panel);color:#eee;border:1px solid #555;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;min-width:0}
  #bar select{max-width:min(420px,60vw);appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,#eee 50%),linear-gradient(135deg,#eee 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

  #cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(560px,calc(100% - 24px));background:var(--panel);padding:8px 12px;border-radius:10px;cursor:pointer}
  #cap b{display:block;font-size:15px}
  #cap span{display:block;font-size:13px;margin-top:2px}
  #cap.min span{display:none}
  #cap b::after{content:' \25BE';opacity:.6;font-size:12px}
  #cap.min b::after{content:' \25B8'}
  #status{position:fixed;inset:0;display:grid;place-items:center;color:var(--ink)}
  body.shot #bar, body.shot #cap{display:none}
</style>

function loadPack(n){ return new Promise(function(ok,bad){ var t=['../assets/shaped/'+n+'.js', n+'.js'];
  (function next(){ if(!t.length) return bad(new Error('could not load '+n)); var s=document.createElement('script'); s.src=t.shift(); s.onload=ok; s.onerror=function(){ s.remove(); next(); }; document.head.appendChild(s); })(); }); }

/* ---------- aliens: pose by clip frame ---------- */

    if (r.slide){ const a=r.slide; inner.position.set(a[0]*v,a[1]*v,a[2]*v); }
    const ps=(P[k]||[]).map(q=>Object.assign({},q,{p:[q.p[0]-r.pivot[0],q.p[1]-r.pivot[1],q.p[2]-r.pivot[2]]})); if (ps.length) inner.add(mesh(ps,col));
    groups[k]={outer,inner}; }
  for (const k in R){ const r=R[k]; (r.parent?groups[r.parent].inner:root).add(groups[k].outer); }
  for (const [i,w] of (MC.wheels[name]||[]).entries()){ const wm=mesh(P.wheel,col); wm.position.set(...w); root.add(wm); }
  return root;
}
/* ---------- animals: posed by clip frame ---------- */
function animal(name, clip, frame){
  const A=AN.creatures[name], parts=AN.parts[name], f=((A.clips[clip]||A.clips.idle)[frame||0])||{}, col=colourer(AN.palette,{}), D=Math.PI/180;
  const root=new THREE.Group(), groups={};
  for (const b in A.bones){ const B=A.bones[b], g=new THREE.Group(), par=B.parent?A.bones[B.parent].pivot:[0,0,0];
    g.position.set(B.pivot[0]-par[0],B.pivot[1]-par[1],B.pivot[2]-par[2]); const r=f[b]; if (r) g.rotation.set(r[0]*D,r[1]*D,r[2]*D);
    const mine=(parts[b]||[]).map(q=>Object.assign({},q,{p:[q.p[0]-B.pivot[0],q.p[1]-B.pivot[1],q.p[2]-B.pivot[2]]})); if (mine.length) g.add(mesh(mine,col)); groups[b]=g; }
  for (const b in A.bones){ const B=A.bones[b]; (B.parent?groups[B.parent]:root).add(groups[b]); }
  if (f.root) root.position.set(f.root[0],f.root[1],f.root[2]);
  const outer=new THREE.Group(); outer.add(root); return outer;
}

}

/* ---------- UI ---------- */
const bar=document.getElementById('bar'), KEYS=Object.keys(SCENES);
const prevB=document.createElement('button'), nextB=document.createElement('button'), sel=document.createElement('select'), num=document.createElement('span');
prevB.textContent='\u2039'; nextB.textContent='\u203A'; prevB.setAttribute('aria-label','Previous scene'); nextB.setAttribute('aria-label','Next scene'); num.className='n'; sel.id='scene'; sel.setAttribute('aria-label','Scene');
KEYS.forEach((k,i)=>{ const o=document.createElement('option'); o.value=k; o.textContent=(i+1)+'. '+SCENES[k].t; sel.appendChild(o); });
sel.onchange=()=>show(sel.value); prevB.onclick=()=>step(-1); nextB.onclick=()=>step(1);
function step(d){ const i=KEYS.indexOf(sel.value); show(KEYS[(i+d+KEYS.length)%KEYS.length]); }
addEventListener('keydown',e=>{ if (e.key==='ArrowRight') step(1); if (e.key==='ArrowLeft') step(-1); });
bar.append(prevB, sel, nextB, num);
const capEl=document.getElementById('cap'); capEl.onclick=()=>capEl.classList.toggle('min'); if (innerWidth<700) capEl.classList.add('min');
function show(k){
  if (scene) scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  scene=new THREE.Scene(); stats={tris:0,verts:0}; cam.fov=35; cam.updateProjectionMatrix(); SCENES[k].make();
  capEl.hidden=false; document.getElementById('capT').textContent=SCENES[k].t;
  document.getElementById('capD').textContent=SCENES[k].d+' Scene: '+stats.tris.toLocaleString('en-US')+' triangles, '+stats.verts.toLocaleString('en-US')+' vertices.';
  baseFov=cam.fov; fitFov(); sel.value=k; num.textContent=(KEYS.indexOf(k)+1)+' / '+KEYS.length;
  location.hash=k; ctl.update(); window.__ready=k;
}
let baseFov=35;
function fitFov(){ const a=cam.aspect, ref=1.6; cam.fov=a<ref?Math.min(100,2*Math.atan(Math.tan(baseFov*Math.PI/360)*ref/a)*180/Math.PI):baseFov; cam.updateProjectionMatrix(); }   /* narrow or upright screens see as much across as a wide one */
function resize(){ const w=innerWidth,h=innerHeight; R.setSize(w,h,false); cam.aspect=w/h; fitFov(); }
addEventListener('resize',resize); resize();
if (/[?&]shot/.test(location.search)) document.body.classList.add('shot');
document.getElementById('status').remove();
show((location.hash.slice(1) in SCENES)?location.hash.slice(1):'survivors');
window.__show=show; window.__stats=()=>stats;
R.setAnimationLoop(()=>{ ctl.update(); R.render(scene,cam); });
</script>
</body>
