  #cap span{display:block;font-size:13px;margin-top:2px}
  #cap.min span{display:none}
  #cap b::after{content:' \25BE';opacity:.6;font-size:12px}

</style>

/* ---------- machines: parts posed by their rig ---------- */
function machineOf(name, vals, noW, hide){
  const P=MC.models[name], R=MC.rig[name], col=colourer(MC.palette,{BODY:MC.paint[name]}), D=Math.PI/180, groups={}, root=new THREE.Group(); vals=vals||{};
  for (const k in R){ if (hide&&hide.indexOf(k)>=0) continue; const r=R[k], par=r.parent?R[r.parent].pivot:[0,0,0], outer=new THREE.Group(), inner=new THREE.Group();
    outer.position.set(r.pivot[0]-par[0],r.pivot[1]-par[1],r.pivot[2]-par[2]); if (r.fixed) outer.rotation.set(r.fixed[0]*D,r.fixed[1]*D,r.fixed[2]*D); outer.add(inner);
    const v=(k in vals)?vals[k]:(r.rest||0);
    if (r.turn){ const a=r.turn; inner.rotation.set(a[0]*v*D,a[1]*v*D,a[2]*v*D); }
    if (r.slide){ const a=r.slide; inner.position.set(a[0]*v,a[1]*v,a[2]*v); }
    const ps=(P[k]||[]).map(q=>Object.assign({},q,{p:[q.p[0]-r.pivot[0],q.p[1]-r.pivot[1],q.p[2]-r.pivot[2]]})); if (ps.length) inner.add(mesh(ps,col));
    groups[k]={outer,inner}; }
  for (const k in R){ if(!groups[k]) continue; const r=R[k]; (r.parent?(groups[r.parent]||{inner:root}).inner:root).add(groups[k].outer); }
  if(!noW) for (const [i,w] of (MC.wheels[name]||[]).entries()){ const wm=mesh(P.wheel,col); wm.position.set(...w); root.add(wm); }
  return root;
}

function kitWheel(tyre, rim, r, w){ const g=new THREE.Group(), col=colourer(KT.palette,{}), T=KT.tyreInfo[tyre]; if(!T) return g;

/* ---------- dressed vehicle: any vehicle + tyres/rims + parts + paint, placed by VEHICLEFIT ---------- */
function dress(vname, o){ o=o||{}; const V=KT.vehicles[vname], plan=VEHICLEFIT.plan(KT,vname,o), root=new THREE.Group(), base=new THREE.Group();
  let bodyCol='#a8843c';
  if (V.pack==='props'){ const m=PR.models.vehicles[vname], pal=Object.assign({},PR.palette,o.paint||{}), col=colourer(pal,{}); bodyCol=pal.paint1||bodyCol;
    base.add(mesh(m.body,col)); base.add(mesh(m.bonnet,col)); }
  else if (V.pack==='machines'){ const sl={BODY:(o.paint&&o.paint.BODY)||MC.paint[vname]}; bodyCol=sl.BODY; base.add(machineOf(vname,null,true)); }
  else if (V.pack==='bikes'){ bodyCol=(o.paint&&o.paint.BODY)||BK.paint[vname]; base.add(rigOf(BK,vname,null,true)); }
  else { bodyCol=(o.paint&&o.paint.BODY)||(BT.paint[vname]&&BT.paint[vname].BODY)||bodyCol; base.add(rigOf(BT,vname,null,false)); }
  base.position.y=plan.lift; root.add(base);
  const pcol=colourer(KT.palette,{BODY:bodyCol});
  plan.wheels.forEach(w=>{ let g;
    if (w.bike){ g=new THREE.Group(); const T=KT.bikeWheelInfo[w.bike]; const mm=mesh(KT.models.bike_wheels[w.bike],pcol); mm.scale.set(w.w,w.r,w.r); g.add(mm); }
    else { g=kitWheel(w.tyre,w.rim,w.r/KT.tyreInfo[w.tyre].rMul,w.w/KT.tyreInfo[w.tyre].wMul); }
    const o2=new THREE.Group(); o2.add(g); o2.rotation.z=0; g.rotation.y=w.flip?Math.PI:0; o2.position.set(...w.pos); root.add(o2); });
  plan.parts.forEach(p=>{ const m=KT.models.parts[p.name]; if(!m) return; const g=mesh(m,pcol); g.position.set(...p.pos); if(p.mirror) g.scale.x=-1; root.add(g); });
  root.userData.plan=plan; return root; }

  pickup2:{t:'Pickup truck parts (replacing Car Kit)',d:'Left to right: whole pickup with the driver\'s door shut, bonnet and door open with the front wheels steered, door off with the opening showing and the loose tyre beside it, the wreck, and the burnt shell. Seen from the driver\'s side.',
    make(){ lights('day'); scene.background=new THREE.Color(0xeeeae2); scene.fog=null; ground(80,40,0xd8d2c6); const col=colourer(PR.palette,{}); const V=PR.models.vehicles, R=PR.vehicleRig;

        const bn=mesh(m.bonnet,col), h=r.bonnetHinge, pv=new THREE.Group(); pv.position.set(h[0],h[1],h[2]); bn.position.set(-h[0],-h[1],-h[2]); pv.add(bn); pv.rotation.x=o.bonnet?-1.0:0; g.add(pv);
        r.wheels.forEach(w=>{ const wm=mesh(m.wheel,col); wm.position.set(w[0],w[1],w[2]); const fw=w[2]>0, e=new THREE.Group(); e.position.copy(wm.position); wm.position.set(0,0,0); if(w[0]<0) wm.rotation.y=Math.PI; e.add(wm); if(fw&&o.steer) e.rotation.y=o.steer; g.add(e); });
        if(o.doorOff) g.add(mesh(m.door_gap,col)); else { const d=mesh(m.door_l,col), hg=r.doorHinge, pv2=new THREE.Group(); pv2.position.set(hg[0],hg[1],hg[2]); d.position.set(-hg[0],-hg[1],-hg[2]); pv2.add(d); pv2.rotation.y=o.door?1.2:0; g.add(pv2); }
        g.position.set(x,(r.sitDrop?-r.sitDrop:0),0); g.rotation.y=Math.PI/2*0+o.ry||0; scene.add(g); return g; };
      build('pickup',{},-14); build('pickup',{bonnet:true,door:true,steer:0.5},-5); build('pickup',{doorOff:true},4);
      const t=mesh(PR.models.items.tyre_loose,col); t.position.set(4,0,-3.4); t.rotation.y=0.4; scene.add(t); const t2=mesh(PR.models.items.tyre_loose_flat,col); t2.position.set(5.2,0,-3.4); scene.add(t2);

  structures:{t:'Structures: bridges, tunnels, dams (map chat)',d:'Back: a beam bridge on piers with abutments, a truss, an arch, a suspension span and a trestle. Middle: a path bridge, a rail bridge, tunnel mouths for road, rail and path with a stretch of lining, culverts, a passage frame and a ford. Front: an earth dam, a concrete dam with a road, a spillway, a weir, a lock, a pier, a breakwater and a retaining wall.',
    make(){ lights('day'); scene.background=new THREE.Color(0xdde6ea); scene.fog=null; ground(400,260,0x6d7a4f); const col=colourer(ST.palette,{}), M=ST.models.structures;
      const put=(n,x,y,z,ry,sy)=>{ const g=mesh(M[n],col); g.position.set(x,y||0,z||0); if(ry) g.rotation.y=ry; if(sy) g.scale.y=sy; scene.add(g); return g; };
      const run=(kind,x,y,z0,n,ry)=>{ for(let i=0;i<n;i++){ const g=mesh(M['deck_'+kind],col); const c=Math.cos(ry||0), s=Math.sin(ry||0), d=z0+i*4+2; g.position.set(x+s*d,y,c*d); g.rotation.y=ry||0; scene.add(g);} };
      // z runs along the bridge; bridges lie along x here (rotated 90 degrees)
      const R=-Math.PI/2; const bridge=(zrow,kind,style)=>{ const W=7, y=7; put('abutment_'+kind,-22,y,zrow,R+Math.PI,1); };
      // beam bridge on piers
      const beam=(z)=>{ for(let i=0;i<10;i++){ const g=mesh(M.deck_road,col); g.position.set(-20+i*4+2,7,z); g.rotation.y=R; scene.add(g);} put('abutment_road',-23,7,z,R); put('abutment_road',23,7,z,-R);
        [-10,2,14].forEach(x=>{ put('pier_cap_road',x,7,z,R); put('pier_shaft_road_unit',x,0,z,R,5.8); }); };
      beam(-70);
      // truss
      for(let i=0;i<8;i++) put('truss_road',-16+i*4+2,4,-52,R); put('abutment_road',-18,4,-52,R); put('abutment_road',18,4,-52,-R);
      // arch: two arch segments
      put('arch_road_8',-4,7.7,-36,R); put('arch_road_8',4,7.7,-36,R);
      // suspension: two towers, hangers
      put('suspension_tower_road',-16,0,-18,R); put('suspension_tower_road',16,0,-18,R); for(let i=0;i<8;i++) put('suspension_hanger_road',-14+i*4,6,-18,R);
      // trestle
      for(let i=0;i<6;i++){ put('deck_road',-10+i*4,4,-2,R); if(i%2==0) put('trestle_bent_unit',-10+i*4,0,-2,R,3.5); }
      // path and rail bridges
      for(let i=0;i<4;i++){ put('deck_path',30+i*4,3,-60,R); put('deck_rail',30+i*4,3,-48,R); } [32,40].forEach(x=>{ put('pier_cap_path',x,3,-60,R); put('pier_shaft_path_unit',x,0,-60,R,2.4); put('pier_cap_rail',x,3,-48,R); put('pier_shaft_rail_unit',x,0,-48,R,2.4); });
      // tunnels
      ['road','rail','path'].forEach((k,i)=>{ const z=-34+i*14; put('portal_'+k,50,0,z,R+Math.PI); put('tunnel_lining_'+k,56,0,z,R); put('tunnel_lining_'+k,60,0,z,R); });
      put('culvert_headwall_pipe',46,0,2,0); put('culvert_headwall_box',54,0,2,0); put('passage_frame',62,0,2,0); put('ford_slab',70,0,2,R);
      // dams, water works
      put('dam_earth_h8',-30,0,26,R); put('dam_concrete_road_h8',-6,0,26,R); put('spillway_h8',16,0,30,R); put('weir_step',30,0,26,R); put('weir_step',34,0,26,R);
      put('lock_gate_closed',44,0,26,0); put('lock_gate_open',54,0,26,0);
      for(let i=0;i<3;i++) put('pier_deck',66,0.4,22+i*4,0); put('pier_end',66,0.4,36,0);
      put('breakwater_mound_h3',-48,0,40,0); put('breakwater_mound_h3',-48,0,44,0); put('retaining_wall_unit',-56,0,26,0,1.5); put('retaining_wall_unit',-56,0,30,0,1.5);
      cam.position.set(5,95,175); ctl.target.set(5,2,-15); }},

      cam.position.set(0,9,9); ctl.target.set(0,0,-2); }},
  damage2:{t:'Broken building states',d:'Damaged wall, window, door, shopfront and garage bays; holes knocked through plain, siding and brick; snapped frames; rubble piles; torn wallpaper inside; bare studs; a boarded door.',
    make(){ lights('day'); scene.background=new THREE.Color(0xeeeae2); scene.fog=null; ground(80,40,0xd8d2c6);
      const cols=BU.examples.corner_store, list=[['wall_plain_damaged','concrete'],['window_siding_damaged','timber'],['door_plain_damaged','concrete'],['shopfront_damaged','steel'],['garage_damaged','concrete'],
        ['hole_plain','concrete'],['hole_siding','timber'],['hole_brick','steel'],['studs','timber'],['door_boarded','timber'],[null,'concrete','snapped'],['rubble_large','concrete'],['inside_torn','timber']];
      list.forEach(([inf,fr,sn],i)=>{ const x=(i%5-2)*3.1, z=-Math.floor(i/5)*4.6, pal=[BU.examples.timber_house,BU.examples.brick_shop,BU.examples.corner_store][i%3];
        at(module(sn?'frame_'+fr+'_snapped':'frame_'+fr,pal),x,0,z); if(!sn) at(module('corner_'+fr,pal),x+1.2,0,z); at(module('plinth',pal),x,0,z); if(inf) at(module(inf,pal),x,0,z, inf==='inside_torn'?Math.PI:0); });
      cam.position.set(1,8,17); ctl.target.set(0,1.2,-4.4); }},
  street_props:{t:'Street props, plants and vehicles',d:'Lamps, signals, bins, barriers, fences, poles, trees and four boxy worn vehicles.',
    make(){ lights('day'); scene.background=new THREE.Color(0xeeeae2); scene.fog=null; ground(80,60,0xd8d2c6);
      const st=Object.keys(PR.models.street); st.forEach((n,i)=>at(prop('street',n),(i%9-4)*2.6,0,-(Math.floor(i/9))*3.4-4,0));
      Object.keys(PR.models.plants).forEach((n,i)=>at(prop('plants',n),(i-2.5)*3.4,0,-12,0.4*i));
      Object.keys(PR.models.vehicles).forEach((n,i)=>at(prop('vehicles',n),(i-1.5)*5,0,3.5,Math.PI/2));
      cam.position.set(0,14,24); ctl.target.set(0,1.5,-4); }},
};
function street(mode){
  lights(mode); const night=mode==='night';
  ground(160,160,night?0x2e3a2c:0x6d7a4f);
  const road=new THREE.Mesh(new THREE.PlaneGeometry(160,9), new THREE.MeshLambertMaterial({color:night?0x1e1f22:0x3a3a3c})); road.rotation.x=-Math.PI/2; road.position.set(0,0.01,9); road.receiveShadow=true; scene.add(road);
  const walk=new THREE.Mesh(new THREE.BoxGeometry(160,0.15,3), new THREE.MeshLambertMaterial({color:night?0x4a4846:0x9a948a})); walk.position.set(0,0.075,3.5); walk.receiveShadow=true; scene.add(walk);
  const L=night?3:0;
  at(building('timber_house',null,L),-15,0,-3.5); at(building('brick_shop',null,L),-5.5,0,-2.5);
  at(building('concrete_flats',null,L),6.5,0,-2.5); at(building('corner_store'),18,0,-2.5);
  for (const x of [-20,-8,4,16]){ const L=at(prop('street','street_lamp'),x,0.15,4.6,Math.PI); if (night){ const l=new THREE.SpotLight(0xffc477,60,16,0.9,0.6,1.5); l.position.set(x,4.6,3.7); l.target.position.set(x,0,3.7); scene.add(l); scene.add(l.target); } }
  at(prop('street','hydrant'),-10,0.15,4.2); at(prop('street','trash_bin'),-2,0.15,4.4); at(prop('street','bus_stop'),10.5,0.15,3.4,Math.PI); at(prop('street','mailbox'),-12.5,0.15,4.4);
  at(prop('street','stop_sign'),23,0.15,4.6,Math.PI); at(prop('street','dumpster'),12.5,0,-4.6,0.1); at(prop('street','traffic_cone'),2,0,7.2); at(prop('street','traffic_cone'),2.8,0,7.6);
  at(prop('street','jersey_barrier'),20,0,8,0.25); at(prop('street','tyre_pile'),23.5,0,1.6);
  for (let i=0;i<4;i++) at(prop('street','picket_fence'),-20.5+i*2.4,0,2.0);
  at(prop('plants','oak'),-20,0,-6); at(prop('plants','pine'),-25,0,-1.5); at(prop('plants','bush'),-11.5,0,1.2); at(prop('plants','dead_tree'),26,0,-4); at(prop('plants','bush'),1.5,0,1.4);
  at(prop('vehicles','hatchback'),-6,0,8.2,Math.PI/2); at(prop('vehicles','pickup'),-17,0,7.0,-Math.PI/2+0.1); at(prop('vehicles','van'),14,0,8.6,Math.PI/2); at(prop('vehicles','sedan'),22,0,10.5,0.7);
  if (!night){ at(survivor(LOOKS[0]),-3,0.15,3.6,0.4); at(survivor(LOOKS[5]),-2.2,0.15,3.2,-0.6); at(survivor(LOOKS[6]),7.5,0.15,3.4,2.4); }
  else { at(survivor(LOOKS[7]),-3,0.15,3.4,0.6); const s=at(alien('stalker','walk',0),9,0,9.5,-1.7); glowLight(s,0x9cff6a,4,5).position.set(0,2,0.5);
    const w=at(alien('swarmer','walk',1),5,0,11,-1.5); glowLight(w,0x9cff6a,3,4).position.set(0,0.6,0.5); }
}

/* ---------- UI ---------- */
const bar=document.getElementById('bar'), KEYS=Object.keys(SCENES);
const prevB=document.createElement('button'), nextB=document.createElement('button'), sel=document.createElement('select'), num=document.createElement('span');
prevB.textContent='\u2039'; nextB.textContent='\u203A'; prevB.setAttribute('aria-label','Previous scene'); nextB.setAttribute('aria-label','Next scene'); num.className='n'; sel.id='scene'; sel.setAttribute('aria-label','Scene');
KEYS.forEach((k,i)=>{ const o=document.createElement('option'); o.value=k; o.textContent=(i+1)+'. '+SCENES[k].t; sel.appendChild(o); });
sel.onchange=()=>show(sel.value); prevB.onclick=()=>step(-1); nextB.onclick=()=>step(1);
function step(d){ const i=KEYS.indexOf(sel.value); show(KEYS[(i+d+KEYS.length)%KEYS.length]); }
addEventListener('keydown',e=>{ if (e.key==='ArrowRight') step(1); if (e.key==='ArrowLeft') step(-1); });
bar.append(prevB, sel, nextB, num);
const capEl=document.getElementById('cap'); capEl.onclick=()=>capEl.classList.toggle('min'); if (innerWidth<700) capEl.classList.add('min');
function show(k){
  if (scene) scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  scene=new THREE.Scene(); stats={tris:0,verts:0}; cam.fov=35; cam.updateProjectionMatrix(); SCENES[k].make();
  capEl.hidden=false; document.getElementById('capT').textContent=SCENES[k].t;
  document.getElementById('capD').textContent=SCENES[k].d+' Scene: '+stats.tris.toLocaleString('en-US')+' triangles, '+stats.verts.toLocaleString('en-US')+' vertices.';
  baseFov=cam.fov; fitFov(); sel.value=k; num.textContent=(KEYS.indexOf(k)+1)+' / '+KEYS.length;
  location.hash=k; ctl.update(); window.__ready=k;
}
let baseFov=35;
function fitFov(){ const a=cam.aspect, ref=1.6; cam.fov=a<ref?Math.min(100,2*Math.atan(Math.tan(baseFov*Math.PI/360)*ref/a)*180/Math.PI):baseFov; cam.updateProjectionMatrix(); }   /* narrow or upright screens see as much across as a wide one */
function resize(){ const w=innerWidth,h=innerHeight; R.setSize(w,h,false); cam.aspect=w/h; fitFov(); }
addEventListener('resize',resize); resize();
if (/[?&]shot/.test(location.search)) document.body.classList.add('shot');
document.getElementById('status').remove();
show((location.hash.slice(1) in SCENES)?location.hash.slice(1):'survivors');
window.__show=show; window.__stats=()=>stats;
R.setAnimationLoop(()=>{ ctl.update(); R.render(scene,cam); });
</script>
